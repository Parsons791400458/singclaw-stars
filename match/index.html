<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明星匹配助手 · StarClaw</title><link rel="icon" href="/favicon.svg"><style>body{margin:0;background:#080712;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.nav a{color:#cbd5e1;text-decoration:none;margin-left:16px}.hero{padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(236,72,153,.12))}h1{font-size:44px;margin:0 0 10px}.muted{color:#a5adbd}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:20px}.card{border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.045);padding:20px}label{font-size:12px;color:#a5adbd}input,select,textarea{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0b1020;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;font-weight:800}.result{display:grid;gap:12px}.match{padding:14px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(0,0,0,.18)}.score{float:right;font-weight:900;color:#f9a8d4}.pill{display:inline-block;margin:4px 4px 0 0;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.09);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><div class="wrap"><div class="nav"><b>StarClaw 明星匹配助手</b><div><a href="/">首页</a><a href="/stars">明星情报</a><a href="/business-summary">报告样例</a></div></div><section class="hero"><h1>输入品牌 Brief，生成明星候选池</h1><p class="muted">先用统一 data.json 跑匹配；后续可无缝替换为 Neon/API。</p></section><section class="grid"><form class="card" id="f"><label>品牌名称</label><input id="brand" value="示例美妆品牌"><label>行业品类</label><select id="cat"><option>美妆护肤</option><option>3C数码</option><option>汽车</option><option>运动户外</option><option>食品饮料</option><option>服饰时尚</option><option>家居</option><option>游戏</option></select><label>预算</label><select id="budget"><option>100-500万</option><option>50-100万</option><option>500万以上</option><option>10-50万</option></select><label>Campaign 目标</label><textarea id="goal">新品首发声量、低风险代言人初筛、可向老板解释推荐理由</textarea><button class="btn">开始匹配</button></form><div class="card"><h2>Top 推荐结果</h2><div id="out" class="result muted">加载中…</div></div></section></div><script>let artists=[];const w={commercialValue:.3,categoryFit:.25,riskControl:.2,heatTrend:.15,partnershipHistory:.1};function score(a,cat){return Math.round((a.commercialValue||0)*w.commercialValue+(a.categoryFit||0)*w.categoryFit+(100-(a.riskLevel||0))*w.riskControl+(a.heatTrend||0)*w.heatTrend+(a.partnershipHistory||0)*w.partnershipHistory+(a.category||[]).includes(cat)*6)}function render(){const cat=document.getElementById('cat').value;const ranked=artists.map(a=>({...a,s:score(a,cat)})).sort((a,b)=>b.s-a.s).slice(0,5);document.getElementById('out').innerHTML=ranked.map((a,i)=>`<div class="match"><span class="score">${a.s}</span><b>${i+1}. ${a.name}</b><div class="muted">${a.role}</div><p>${a.bestUse||a.recentSignal||''}</p>${(a.evidence||[]).map(x=>`<span class="pill">${x}</span>`).join('')}<div class="muted">风险：${(a.riskTags||[]).join('；')}</div></div>`).join('')}document.getElementById('f').onsubmit=e=>{e.preventDefault();render()};fetch('/data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{artists=d.artists||[];render()})</script></body></html>
