<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌 × 明星匹配助手 · StarClaw</title><link rel="icon" href="/favicon.svg"><style>:root{--bg:#070814;--text:#f8fafc;--muted:#a7b0c0;--line:rgba(255,255,255,.12);--p:#8b5cf6;--pk:#ec4899}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070814,#0b1020 55%,#06070f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.wrap{width:min(1160px,calc(100% - 32px));margin:auto;padding:30px 0}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.nav a{color:#d3d8e3;text-decoration:none;margin-left:16px}.hero,.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04))}.hero{padding:28px}.hero h1{font-size:46px;margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:.88fr 1.12fr;gap:18px;margin-top:20px}.card{padding:20px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin:6px 0 12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1020;color:white}.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--pk));color:white;font-weight:800}.result{display:grid;gap:12px}.match{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04)}.score{float:right;font-weight:950;color:#f9a8d4;font-size:20px}.pill{display:inline-block;margin:4px 4px 0 0;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table td,.table th{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}.report{white-space:pre-wrap;background:#080c18;border:1px solid var(--line);border-radius:16px;padding:16px;min-height:180px}@media(max-width:900px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}}</style></head><body><div class="wrap"><div class="nav"><b>StarClaw 品牌 × 明星匹配助手</b><div><a href="/">首页</a><a href="/stars">明星情报</a><a href="/business-summary">报告样例</a></div></div><section class="hero"><h1>输入 Brief，生成 shortlist</h1><p class="muted">适合品牌市场负责人、公关代理商、商务团队做代言人初筛与提案前置判断。</p></section><section class="grid"><form class="card" id="f"><label>品牌名称</label><input id="brand" value="示例美妆品牌"><label>行业品类</label><select id="cat"><option>美妆护肤</option><option>3C数码</option><option>汽车</option><option>运动户外</option><option>食品饮料</option><option>服饰时尚</option><option>家居</option><option>游戏</option></select><label>预算区间</label><select id="budget"><option>100-500万</option><option>50-100万</option><option>500万以上</option><option>10-50万</option></select><label>目标消费者</label><input id="aud" value="年轻女性 / 一二线城市 / 社媒活跃"><label>Campaign 目标</label><textarea id="goal">新品首发声量、可解释推荐、低风险代言人初筛</textarea><button class="btn">生成匹配结果</button></form><div class="card"><h2 style="margin-top:0">Top 推荐结果</h2><div id="out" class="result muted">加载中…</div><h3>对比矩阵</h3><table class="table"><thead><tr><th>艺人</th><th>分数</th><th>风险</th></tr></thead><tbody id="rows"></tbody></table><h3>推荐摘要</h3><div id="report" class="report"></div></div></section></div><script>let artists=[];const w={commercialValue:.3,categoryFit:.25,riskControl:.2,heatTrend:.15,partnershipHistory:.1};function score(a,cat){return Math.round((a.commercialValue||0)*w.commercialValue+(a.categoryFit||0)*w.categoryFit+(100-(a.riskLevel||0))*w.riskControl+(a.heatTrend||0)*w.heatTrend+(a.partnershipHistory||0)*w.partnershipHistory+((a.category||[]).includes(cat)?6:0))}function render(){const cat=document.getElementById('cat').value;const ranked=artists.map(a=>({...a,s:score(a,cat)})).sort((a,b)=>b.s-a.s).slice(0,5);document.getElementById('out').innerHTML=ranked.map((a,i)=>`<div class="match"><span class="score">${a.s}</span><b>${i+1}. ${a.name}</b><div class="muted">${a.role}</div><p>${a.bestUse||a.recentSignal||''}</p>${(a.evidence||[]).map(x=>`<span class="pill">${x}</span>`).join('')}<div class="muted">风险：${(a.riskTags||[]).join('；')}</div></div>`).join('');document.getElementById('rows').innerHTML=ranked.map(a=>`<tr><td>${a.name}</td><td>${a.s}</td><td>${(a.riskTags||[]).join('；')}</td></tr>`).join('');const p=ranked[0];document.getElementById('report').textContent=p?`品牌：${document.getElementById('brand').value}\n品类：${cat} / 预算：${document.getElementById('budget').value}\n目标人群：${document.getElementById('aud').value}\n目标：${document.getElementById('goal').value}\n\n推荐艺人：${p.name}\n推荐理由：${(p.evidence||[]).join('；')}\n风险提示：${(p.riskTags||[]).join('；')}\n下一步：确认档期、报价、竞品排他、舆情预案。`:''}document.getElementById('f').onsubmit=e=>{e.preventDefault();render()};fetch('/data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{artists=d.artists||[];render()})</script></body></html>
